[project]
name = "wordistanbackend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ömer Faruk", email = "omersoftware853@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
wordistanbackend = "wordistanbackend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
